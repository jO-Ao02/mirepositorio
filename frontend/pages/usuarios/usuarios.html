<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios — Panel de Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>

<div id="barraSuperior"></div>

<main class="contenido">

  <div class="cabecera-seccion">
    <div>
      <h1>Usuarios del sistema</h1>
      <p>Administra las cuentas del personal: meseros, cocina, cajeros y otros administradores.</p>
    </div>
    <a href="usuariosForm.html" class="boton boton--principal" style="width:auto;">+ Nuevo usuario</a>
  </div>

  <div class="tabla-envoltorio">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Rol</th>
          <th>Estado</th>
          <th style="text-align:right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpoTablaUsuarios"></tbody>
    </table>
    <div id="mensajeSinUsuarios" class="mensaje-vacio" hidden>Cargando usuarios...</div>
  </div>

</main>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../components/topBar.js"></script>
<script src="../../js/usuarios/usuarios.js"></script>

</html>
